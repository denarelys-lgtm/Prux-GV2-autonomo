plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.detectcamera'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.detectcamera"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Evita el error mergeDebugJavaResource por .properties duplicados
    // dentro de los .jar de BouncyCastle.
    packaging {
        resources {
            excludes += [
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'org/bouncycastle/x509/CertPathReviewerMessages*.properties',
                    'org/bouncycastle/pkcs/PKCS12Messages*.properties'
            ]
        }
    }
}

// Excluye TODAS las variantes de BouncyCastle que puedan venir
// transitivamente (jdk15on / jdk15to18 / jdk18on / ext-*) para evitar
// el error "Duplicate class org.bouncycastle.*".
configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk18on'

    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk18on'

    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk18on'

    exclude group: 'org.bouncycastle', module: 'bcprov-ext-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcprov-ext-jdk15to18'
    exclude group: 'org.bouncycastle', module: 'bcprov-ext-jdk18on'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Servidor Web local
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ADB/Wireless Debugging client
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    // BouncyCastle: una sola versión, consistente entre los 3 artefactos.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.78.1'

    // Cifrado de ficheros (EncryptedFile)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
